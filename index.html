<body>
    <img src="MEDIA/REGISTER/FUNDAL.png" alt="Fitness silhouette background" class="background-image">
    <video class="avatar" autoplay muted loop>
        <source src="MEDIA/REGISTER/LOGO.mp4" type="video/mp4">
    </video>
    
    <div class="registration-container">
        <h1 class="form-title">Hi! Create Your Account.</h1>
        
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <div class="input-container">
                <img src="MEDIA/REGISTER/useradd.svg" alt="User icon" class="input-icon">
                <input id="username" type="text" class="form-input" placeholder="Enter your username">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <div class="input-container">
                <img src="MEDIA/REGISTER/email.svg" alt="Email icon" class="input-icon">
                <input id="email" type="email" class="form-input" placeholder="Enter your email">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-container">
                <img src="MEDIA/REGISTER/passwordfill.svg" alt="Password icon" class="input-icon">
                <input id="password" type="password" class="form-input" placeholder="Create a password">
            </div>
        </div>
        
        <div class="checkbox-container">
            <input type="checkbox" class="checkbox" id="terms-checkbox">
            <label class="checkbox-label" for="terms-checkbox">I agree to the Terms and Conditions</label>
        </div>
        
        <div class="checkbox-container">
            <input type="checkbox" class="checkbox" id="newsletter-checkbox">
            <label class="checkbox-label" for="newsletter-checkbox">Subscribe to our newsletter</label>
        </div>
        
        <button class="register-btn">REGISTER</button>
        
        <p class="sign-in-text">Already have an account? <span class="sign-in-link">Sign in</span></p>
    </div>

        <script>
        const form = document.querySelector('.registration-container');
        const usernameInput = document.querySelector('input[type="text"]');
        const emailInput = document.querySelector('input[type="email"]');
        const passwordInput = document.querySelector('input[type="password"]');
        const registerBtn = document.querySelector('.register-btn');
        const termsCheckbox = document.getElementById('terms-checkbox');
        const newsletterCheckbox = document.getElementById('newsletter-checkbox');
        const signInLink = document.querySelector('.sign-in-link');
        
        registerBtn.addEventListener('click', function(e) {
            e.preventDefault();
            
            let isValid = true;
            let errorMessage = '';
            
            if (!usernameInput.value.trim()) {
                isValid = false;
                errorMessage += 'Username is required\n';
                usernameInput.style.borderColor = '#ff3333';
            } else {
                usernameInput.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailInput.value.trim() || !emailRegex.test(emailInput.value.trim())) {
                isValid = false;
                errorMessage += 'Valid email is required\n';
                emailInput.style.borderColor = '#ff3333';
            } else {
                emailInput.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            }
            
            if (!passwordInput.value.trim() || passwordInput.value.length < 6) {
                isValid = false;
                errorMessage += 'Password must be at least 6 characters\n';
                passwordInput.style.borderColor = '#ff3333';
            } else {
                passwordInput.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            }
            
            if (!termsCheckbox.checked) {
                isValid = false;
                errorMessage += 'You must agree to the Terms and Conditions\n';
                termsCheckbox.nextElementSibling.style.color = '#ff3333';
            } else {
                termsCheckbox.nextElementSibling.style.color = '#ffffff';
            }
            
            if (isValid) {
                window.location.href = "WORKOUTS.html";
            } else {
                alert('Please fix the following errors:\n' + errorMessage);
            }
        });
        
        signInLink.addEventListener('click', function() {
            alert('Redirecting to sign in page...');
        });
    </script>
</body>
</html>
