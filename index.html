<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Risque&family=Rowdies:wght@300;400;700&family=Slabo+13px&family=Slabo+27px&family=Slackey&family=Sniglet:wght@400;800&family=Tilt+Neon&family=Tilt+Warp&family=Wellfleet&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Wellfleet', sans-serif;
            background-color: #121212;
            position: relative;
            height: 100vh;
            overflow: hidden;
        }
        
        .background-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 1;
        }
        
        .avatar {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 120px;
            height: 120px;
        }
        
        .registration-container {
            font-family: 'Wellfleet', sans-serif;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            background-color: rgba(30, 30, 30, 0.9);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            z-index: 1;
            padding: 30px;
        }
        
        .form-title {
            color: #ffffff;
            font-size: 28px;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }
        
        .form-group {
            font-family: 'Slackey', sans-serif;
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .input-container {
            position: relative;
            width: 100%;
        }
        
        .form-input {
            width: 100%;
            height: 45px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            padding: 10px 10px 10px 40px;
            font-size: 16px;
            color: #ffffff;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #0088ff;
            background-color: rgba(255, 255, 255, 0.15);
        }
        
        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        
        .input-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #0088ff;
        }
        
        .checkbox-container {
            font-family: 'Tilt Neon', sans-serif;
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin-right: 10px;
            cursor: pointer;
            position: relative;
        }
        
        .checkbox:checked {
            background-color: #0088ff;
            border-color: #0088ff;
        }
        
        .checkbox:checked::after {
            content: "✓";
            position: absolute;
            color: white;
            font-size: 14px;
            top: 0;
            left: 4px;
        }
        
        .checkbox-label {
            font-size: 14px;
            color: #ffffff;
        }
        
        .register-btn {
            font-family: 'Tilt Warp', sans-serif;
            width: 100%;
            height: 45px;
            background-color: #0088ff;
            border: none;
            border-radius: 5px;
            font-size: 27px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        
        .register-btn:hover {
            background-color: #941302bd;
        }
        
        .sign-in-text {
            font-family: 'Tilt Neon', sans-serif;
            font-size: 12px;
            color: #ffffff;
            text-align: center;
            margin-top: 20px;
        }
        
        .sign-in-link {
            color: #0088ff;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }
        
        .sign-in-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <img src="../MEDIA/REGISTER/FUNDAL.png" alt="Fitness silhouette background" class="background-image">;
<video class="avatar" autoplay muted loop>
    <source src="../MEDIA/REGISTER/LOGO.mp4" type="video/mp4">
</video>
    
    <div class="registration-container">
        <h1 class="form-title">Hi! Create Your Account.</h1>
        
        <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <div class="input-container">
                <img src="../MEDIA/REGISTER/useradd.svg" alt="User icon" class="input-icon">
                <input id="username" input type="text" class="form-input" placeholder="Enter your username">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <div class="input-container">
                <img src="../MEDIA/REGISTER/email.svg" alt="Email icon" class="input-icon">
                <input id="email" input type="email" class="form-input" placeholder="Enter your email">
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-container">
                <img src="../MEDIA/REGISTER/passwordfill.svg" alt="Password icon" class="input-icon">
                <input id="password" input type="password" class="form-input" placeholder="Create a password">
            </div>
        </div>
        
        <div class="checkbox-container">
            <input type="checkbox" class="checkbox" id="terms-checkbox">
            <label class="checkbox-label" for="terms-checkbox">I agree to the Terms and Conditions</label>
        </div>
        
        <div class="checkbox-container">
            <input type="checkbox" class="checkbox" id="newsletter-checkbox">
            <label class="checkbox-label" for="newsletter-checkbox">Subscribe to our newsletter</label>
        </div>
        
        <button class="register-btn">REGISTER</button>
        
        <p class="sign-in-text">Already have an account? <span class="sign-in-link">Sign in</span></p>
    </div>
    
    <script>
        const form = document.querySelector('.registration-container');
        const usernameInput = document.querySelector('input[type="text"]');
        const emailInput = document.querySelector('input[type="email"]');
        const passwordInput = document.querySelector('input[type="password"]');
        const registerBtn = document.querySelector('.register-btn');
        const termsCheckbox = document.getElementById('terms-checkbox');
        const newsletterCheckbox = document.getElementById('newsletter-checkbox');
        const signInLink = document.querySelector('.sign-in-link');
        
        registerBtn.addEventListener('click', function(e) {
            e.preventDefault();
            
            let isValid = true;
            let errorMessage = '';
            
            if (!usernameInput.value.trim()) {
                isValid = false;
                errorMessage += 'Username is required\n';
                usernameInput.style.borderColor = '#ff3333';
            } else {
                usernameInput.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailInput.value.trim() || !emailRegex.test(emailInput.value.trim())) {
                isValid = false;
                errorMessage += 'Valid email is required\n';
                emailInput.style.borderColor = '#ff3333';
            } else {
                emailInput.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            }
            
            if (!passwordInput.value.trim() || passwordInput.value.length < 6) {
                isValid = false;
                errorMessage += 'Password must be at least 6 characters\n';
                passwordInput.style.borderColor = '#ff3333';
            } else {
                passwordInput.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            }
            
            if (!termsCheckbox.checked) {
                isValid = false;
                errorMessage += 'You must agree to the Terms and Conditions\n';
                termsCheckbox.nextElementSibling.style.color = '#ff3333';
            } else {
                termsCheckbox.nextElementSibling.style.color = '#ffffff';
            }
            
            if (isValid) {
                window.location.href = "WORKOUTS.html";
            } else {
                alert('Please fix the following errors:\n' + errorMessage);
            }
        });
        signInLink.addEventListener('click', function() {
            alert('Redirecting to sign in page...');
        });
    </script>
</body>
</html>
