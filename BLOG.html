<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Risque&family=Rowdies:wght@300;400;700&family=Slabo+13px&family=Slabo+27px&family=Slackey&family=Sniglet:wght@400;800&family=Tilt+Neon&family=Tilt+Warp&family=Wellfleet&display=swap" rel="stylesheet">
  <style>
 body {
      margin: 0;
      padding: 0;
      font-family: 'Slackey', cursive;
      background-color: #000;
      color: white;
      box-sizing: border-box;
      padding: 30px;
    }

.container {
  max-width: 1200px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

.left-section {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon1 {
  width: 80px;
  height: 80px;
}

.icon2 {
  width: 300px;
  height: 100px;
}

.title {
  text-align: center;
}

.title h1 {
  font-size: 3em;
  font-weight: bold;
}

.spotify {
  width: 120px;
  height: 120px;
}

.footer-image {
  position: relative;
  margin-top: 40px;
  text-align: center;
}

.footer-image img {
  width: 100%;
  max-height: 250px;
  object-fit: cover;
}

.footer-image p {
  position: absolute;
  left: 10px;
  bottom: 10px;
  font-size: 0.9em;
  transform: rotate(-90deg);
  transform-origin: left bottom;
  } 

.stars {
      text-align: right;
      font-size: 54px;
      padding: 50px;
    } 

    .star-button {
  text-decoration: none;
  color: white;    
  transition: transform 0.2s ease, color 0.2s ease;
}

.star-button:hover {
  transform: scale(1.3);
  color: gold;
}       

    </style>
</head>

<body>
<div class="container">
    <header class="header">
      <div class="left-section">
        <img src="../MEDIA/BLOG/BUDS.png" alt="icon1" class="icon1"/>
        <p>Music recommendations for<br>an elite workout:</p>
      </div>
      <div class="title">
        <h1>BLOG</h1>
        <img src="../MEDIA/BLOG/MUSIC.png" alt="icon2" class="icon2"/>
      </div>
      <img src="../MEDIA/BLOG/SPOTIFY.png" alt="Spotify" class="spotify"/>
    </header>
  
    <div class="footer-image">
      <img src="../MEDIA/BLOG/Gunter.png" alt="Bodybuilder" />
      <p>“SMILE IS NOT AN OFFICIAL POSE GUNTER.”</p>
    </div>

        <div class="stars">
  <a href="MOTIVATION.html" class="star-button">★</a>
</div>  
</body>
</html>
